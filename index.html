<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساباتي الشخصية</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#101426,#25204a);
  color: white;
  text-align: center;
  padding: 25px 15px;
}
.card {
  max-width: 380px;
  margin: 40px auto;
  padding: 30px 20px;
  background: #ffffff12;
  border: 1px solid #ffffff40;
  border-radius: 25px;
  box-shadow: 0 10px 35px #0008;
}
h1 { color: #d9b7ff; }
p { color: #ddd; }
a {
  display: block;
  margin: 15px 0;
  padding: 15px;
  border-radius: 12px;
  background: #7652c8;
  color: white;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="card">
<h1>حساباتي الشخصية</h1>
<p>أهلاً وسهلاً بكم 🌹</p>

<a href="https://instagram.com/">Instagram</a>
<a href="https://facebook.com/">Facebook</a>
<a href="https://t.me/">Telegram</a>
<a href="https://tiktok.com/">TikTok</a>
<a href="https://wa.me/">WhatsApp</a>

<p>شكراً لزيارتكم ❤️</p>
</div>
</body>
</html>
